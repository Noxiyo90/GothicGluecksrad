<div class="layout">
  <div class="layout__wheel">
    <app-gluecksrad
      [segmentGruppe]="aktuelleGruppe()"
      [started]="started()"
      (gewinnerSegmentOutput)="gewinnerSegmentOutput($event)"
      (startGame)="startGame()"
    ></app-gluecksrad>
  </div>

  <div class="layout__controls">
    <app-auswahl
    ></app-auswahl>
  </div>
</div>

<div class="bottom-bar">
  <app-settings></app-settings>
  <button class="reset-btn" type="button" (click)="neuStarten()" aria-label="Zurücksetzen">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M3 3v5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

@if (oeffneModal()) {
  <app-charakter-modal
    [characterData]="auswahlComponent.characterData()"
    [name]="generierterName()"
    (neuStarten)="neuStarten()"
  ></app-charakter-modal>
}
