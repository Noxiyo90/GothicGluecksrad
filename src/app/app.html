<div class="layout">
  <div class="layout__wheel">
    <app-gluecksrad
      [segmentGruppe]="aktuelleGruppe()"
      [started]="started()"
      (gewinnerSegmentOutput)="gewinnerSegmentOutput($event)"
      (startGame)="startGame()"
    ></app-gluecksrad>

      <div class="wheel-buttons">
        <button (click)="prev()">Zurück</button>
        <button (click)="next()">Weiter</button>
      </div>
  </div>

  <div class="layout__controls">
    <app-auswahl
    ></app-auswahl>
  </div>
</div>
